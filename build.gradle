plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.financialhelper'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// OpenAI 공식 Java SDK
	implementation 'com.openai:openai-java:4.52.0'

	// Spring Boot와 Flyway 연결
	implementation 'org.springframework.boot:spring-boot-starter-flyway'

	// 공식 HTML 원문 파싱 / 정규화
	implementation 'org.jsoup:jsoup:1.23.2'

	// 공식 PDF 원문에서 텍스트를 추출하되 원본 bytes는 SourceDocument에 보존
	implementation 'org.apache.pdfbox:pdfbox:3.0.5'

	// HWP 5.0 OLE container access for the narrow official HWP parser
	implementation 'org.apache.poi:poi:5.4.1'

	// Flyway PostgreSQL 지원
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.microsoft.playwright:playwright:1.64.0'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Test-only HTTP server for the isolated browser E2E harness. Never uses bootRun's local profile.
tasks.register('browserE2eServer', JavaExec) {
	group = 'verification'
	description = 'Runs the isolated follow-up browser E2E backend'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.financialhelper.e2e.FollowUpBrowserE2EHarness'
	standardInput = System.in
	environment 'SPRING_PROFILES_ACTIVE', 'browser-e2e'
	environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
	dependsOn tasks.named('testClasses')
}
