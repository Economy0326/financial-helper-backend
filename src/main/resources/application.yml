# 모든 환경에서 공통으로 사용하는 기본 설정

spring:
  application:
    name: financial-helper-backend

  # local -> 내 컴퓨터
  # prod -> 실제 배포 서버
  profiles:
    default: local

app:
  guest-session:
    ttl: ${GUEST_SESSION_TTL:PT24H}

    cookie:
      same-site: ${GUEST_COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  ai:
    enabled: ${AI_ENABLED:false}
    smoke-test-enabled: ${AI_SMOKE_TEST_ENABLED:false}

    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      timeout: ${OPENAI_TIMEOUT:30s}

    analysis:
      stale-after: ${AI_ANALYSIS_STALE_AFTER:PT2M}
      max-attempts: ${AI_ANALYSIS_MAX_ATTEMPTS:3}