spring:
  datasource:
    # Windows 환경변수에서 갖고오기
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # DDL 임의로 못 쓰게 설정
      ddl-auto: none
    open-in-view: false

# local은 http://localhost이므로 Secure = false
app:
  law-open-api:
    # Local grounded QA must exercise the direct law API when LAW_OC is present.
    # Production keeps its own explicit profile setting.
    enabled: ${LAW_OPEN_API_ENABLED:true}
  guest-session:
    cookie:
      secure: false
