spring:
  datasource:
    url: ${E2E_DB_URL}
    username: ${E2E_DB_USERNAME}
    password: ${E2E_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: 127.0.0.1
  port: 8080

app:
  auth:
    general-consultation-required: true
    kakao:
      enabled: false
    naver:
      enabled: false
    limits:
      rate-limit-enabled: false
  guest-session:
    cookie:
      secure: false
      same-site: Lax
  cors:
    allowed-origin: http://localhost:3000
  ai:
    enabled: true
    smoke-test-enabled: false
    openai:
      api-key: browser-e2e-stub-only
      model: browser-e2e-stub
  law-open-api:
    enabled: false
  source-ingestion:
    run-on-startup: false
  card-corpus:
    run-on-startup: false
  breadth-corpus:
    run-on-startup: false
