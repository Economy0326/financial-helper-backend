spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  auth:
    general-consultation-required: false
    kakao:
      enabled: false
    limits:
      rate-limit-enabled: false
      global-ai-budget-enabled: false
  guest-session:
    ttl: PT24H
    cookie:
      secure: false
      same-site: Lax

  cors:
    allowed-origin: http://localhost:3000

  ai:
    enabled: true
    smoke-test-enabled: false

    openai:
      api-key: test-only-key
      model: gpt-5.6-luna
      timeout: 30s

    analysis:
      stale-after: PT1M
      max-attempts: 3
