spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  guest-session:
    ttl: PT24H
    cookie:
      secure: false
      same-site: Lax

  cors:
    allowed-origin: http://localhost:3000

  ai:
    enabled: true
    smoke-test-enabled: false

    openai:
      # Test에서는 실제 OpenAI 호출을 하지 않는다.
      api-key: test-only-key
      model: gpt-5.6-luna
      timeout: 30s